<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
#wrap{width:100%;font-family:'Space Mono',monospace;background:#fff}
#hdr{background:#FF2B72;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #D7922F}
#hdr h1{font-family:'Black Han Sans',sans-serif;font-size:26px;color:#fff;letter-spacing:4px;text-shadow:3px 3px 0 #9b1a44;line-height:1}
#hdr .sub{font-size:9px;color:rgba(255,255,255,0.65);letter-spacing:3px;margin-top:3px}
#sval{font-size:24px;font-weight:700;color:#fff;text-align:right}
#slbl{font-size:9px;color:rgba(255,255,255,0.65);letter-spacing:2px;text-align:right}
#game{width:100%;height:440px;background:#565A8B;position:relative;overflow:hidden;cursor:crosshair;user-select:none;-webkit-user-select:none}
#bgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);background-size:36px 36px}
#floor{position:absolute;bottom:0;left:0;right:0;height:68px;background:#D7922F;border-top:4px solid #a0671e}
#ftex{position:absolute;bottom:0;left:0;right:0;height:68px;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0.07) 0,rgba(0,0,0,0.07) 1px,transparent 1px,transparent 38px)}
.wall{position:absolute;top:0;bottom:68px;width:20px;background:#59943B;border:2px solid #3a6624}
#wl{left:0;border-left:none;border-radius:0 4px 4px 0}
#wr{right:0;border-right:none;border-radius:4px 0 0 4px}
#ceil{position:absolute;top:0;left:0;right:0;height:12px;background:#59943B;border-bottom:2px solid #3a6624}
#boneco{position:absolute;transform-origin:center bottom;width:90px;height:160px;pointer-events:none}
#boneco img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;user-drag:none;draggable:false}
#hitbox{position:absolute;cursor:crosshair}
#dbar-bg{position:absolute;bottom:68px;left:20px;right:20px;height:6px;background:rgba(0,0,0,0.25)}
#dbar{height:100%;width:0%;background:linear-gradient(90deg,#59943B 0%,#D7922F 50%,#FF2B72 100%);transition:width 0.25s}
#combo{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:'Black Han Sans',sans-serif;font-size:28px;color:#FF2B72;letter-spacing:2px;opacity:0;transition:opacity 0.2s;pointer-events:none;text-shadow:2px 2px 0 rgba(0,0,0,0.25);white-space:nowrap}
#pop{position:absolute;pointer-events:none;font-family:'Black Han Sans',sans-serif;font-size:20px;opacity:0;text-shadow:1px 1px 0 rgba(0,0,0,0.3);transition:opacity 0.05s}
</style>

const game=document.getElementById('game');
const bonecoEl=document.getElementById('boneco');
const hitbox=document.getElementById('hitbox');
const bimg=document.getElementById('bimg');
const sval=document.getElementById('socos-val')||document.getElementById('sval');
const combo=document.getElementById('combo');
const pop=document.getElementById('pop');
const dbar=document.getElementById('dbar');
let bx,by,vx=0,vy=0,dragging=false,dsx,dsy,bsx,bsy,ldx,ldy;
let socos=0,hits=0,cmb=0,cmbt=null,imgIdx=0;
const BW=90,BH=160,G=0.45,BNC=0.55,FR=0.90;

function bounds(){return{f:game.offsetHeight-68,l:20,r:game.offsetWidth-20,c:12};}

function init(){
  const b=bounds();
  bx=game.offsetWidth/2-BW/2;
  by=b.f-BH;
  bimg.src=IMGS[0];
  syncHitbox();
  loop();
}

function syncHitbox(){
  hitbox.style.left=bx+'px';
  hitbox.style.top=by+'px';
  hitbox.style.width=BW+'px';
  hitbox.style.height=BH+'px';
}

function move(){
  bonecoEl.style.left=bx+'px';
  bonecoEl.style.top=by+'px';
  const tilt=Math.max(-35,Math.min(35,vx*2.5));
  bonecoEl.style.transform='rotate('+tilt+'deg)';
  syncHitbox();
}

function setImg(i){if(i!==imgIdx){imgIdx=i;bimg.src=IMGS[i];}}

function updDmg(){
  const p=Math.min(100,(hits/80)*100);
  dbar.style.width=p+'%';
  if(p<25)setImg(0);else if(p<50)setImg(1);else if(p<75)setImg(2);else setImg(3);
}

const ax=new(window.AudioContext||window.webkitAudioContext)();

function sndHurt(n){
  const t=ax.currentTime,o=ax.createOscillator(),g=ax.createGain(),d=ax.createWaveShaper();
  const c=new Float32Array(256);
  for(let i=0;i<256;i++){const x=(i*2)/256-1;c[i]=(Math.PI+200)*x/(Math.PI+200*Math.abs(x));}
  d.curve=c;o.connect(d);d.connect(g);g.connect(ax.destination);
  const f=160+Math.random()*80;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.35,t+0.14);
  o.type='square';
  g.gain.setValueAtTime(Math.min(1,0.4*n),t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.start(t);o.stop(t+0.2);
}

function sndWall(){
  const t=ax.currentTime,o=ax.createOscillator(),g=ax.createGain();
  o.connect(g);g.connect(ax.destination);o.type='sawtooth';
  o.frequency.setValueAtTime(85,t);o.frequency.exponentialRampToValueAtTime(25,t+0.18);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.start(t);o.stop(t+0.22);
}

function sndCombo(){
  const t=ax.currentTime,o=ax.createOscillator(),g=ax.createGain();
  o.connect(g);g.connect(ax.destination);o.type='square';
  o.frequency.setValueAtTime(350,t);o.frequency.setValueAtTime(550,t+0.06);
  g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.start(t);o.stop(t+0.22);
}

function showPop(txt,x,y){
  pop.textContent=txt;
  pop.style.left=(x-18)+'px';
  pop.style.top=(y-44)+'px';
  pop.style.color=cmb>=5?'#D7922F':cmb>=3?'#FF2B72':'#fff';
  pop.style.opacity='1';
  clearTimeout(pop._t);
  pop._t=setTimeout(()=>pop.style.opacity='0',480);
}

function doSoco(mx,my){
  ax.resume();socos++;hits++;cmb++;
  document.getElementById('sval').textContent=socos;
  updDmg();
  clearTimeout(cmbt);
  if(cmb>=3){
    combo.textContent=cmb+'x COMBO!';
    combo.style.opacity='1';
    combo.style.color=cmb>=5?'#D7922F':'#FF2B72';
    sndCombo();
  }else{
    combo.style.opacity='0';
  }
  cmbt=setTimeout(()=>{cmb=0;combo.style.opacity='0';},1000);
  sndHurt(1+cmb*0.1);
  const ls=['OOF!','POW!','BAM!','AU!','UGH!'];
  showPop(cmb>=5?'BRUTAL!!':cmb>=3?'COMBO!':ls[Math.floor(Math.random()*ls.length)],mx,my);
}

function loop(){
  if(!dragging){
    vy+=G;vx*=FR;bx+=vx;by+=vy;
    const b=bounds();
    if(by+BH>=b.f){by=b.f-BH;if(Math.abs(vy)>4)sndWall();vy=-vy*BNC;vx*=0.82;if(Math.abs(vy)<0.8)vy=0;}
    if(bx<=b.l){bx=b.l;if(Math.abs(vx)>3)sndWall();vx=Math.abs(vx)*BNC;}
    if(bx+BW>=b.r){bx=b.r-BW;if(Math.abs(vx)>3)sndWall();vx=-Math.abs(vx)*BNC;}
    if(by<=b.c){by=b.c;if(Math.abs(vy)>3)sndWall();vy=Math.abs(vy)*BNC;}
  }
  move();
  requestAnimationFrame(loop);
}

// Hitbox handles all interaction — not the img
hitbox.addEventListener('mousedown',e=>{
  e.preventDefault();
  ax.resume();
  const r=game.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  dragging=true;dsx=mx;dsy=my;bsx=bx;bsy=by;ldx=mx;ldy=my;vx=0;vy=0;
  const dx=mx-(bx+BW/2),dy=my-(by+BH/2),dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));
  vx=dx/dist*12;vy=dy/dist*12-2;
  doSoco(mx,my);
});

window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const r=game.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  bx=bsx+(mx-dsx);by=bsy+(my-dsy);
  vx=(mx-ldx)*0.8;vy=(my-ldy)*0.8;ldx=mx;ldy=my;
});

window.addEventListener('mouseup',()=>{
  if(dragging){dragging=false;vx*=4;vy*=4;}
});

hitbox.addEventListener('touchstart',e=>{
  e.preventDefault();ax.resume();
  const t=e.touches[0],r=game.getBoundingClientRect();
  const mx=t.clientX-r.left,my=t.clientY-r.top;
  dragging=true;dsx=mx;dsy=my;bsx=bx;bsy=by;ldx=mx;ldy=my;vx=0;vy=0;
  const dx=mx-(bx+BW/2),dy=my-(by+BH/2),dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));
  vx=dx/dist*12;vy=dy/dist*12-2;doSoco(mx,my);
},{passive:false});

window.addEventListener('touchmove',e=>{
  if(!dragging)return;
  const t=e.touches[0],r=game.getBoundingClientRect();
  const mx=t.clientX-r.left,my=t.clientY-r.top;
  bx=bsx+(mx-dsx);by=bsy+(my-dsy);
  vx=(mx-ldx)*0.8;vy=(my-ldy)*0.8;ldx=mx;ldy=my;
},{passive:false});

window.addEventListener('touchend',()=>{
  if(dragging){dragging=false;vx*=4;vy*=4;}
});

init();
</script>
